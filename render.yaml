# Deploy na Render: New + > Blueprint > selecione este repositório.
# Cria o banco PostgreSQL e o serviço web já ligados entre si.
databases:
  - name: barbearia-db
    plan: free
    databaseName: barbearia
    user: barbearia

services:
  - type: web
    name: barbearia
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --preload cria as tabelas uma única vez antes de iniciar os workers
    startCommand: gunicorn --preload --workers 2 --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: barbearia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USUARIO
        value: barbeiro
      - key: ADMIN_SENHA
        sync: false   # a Render pede o valor no primeiro deploy
      - key: BARBEARIA_NOME
        value: Zangão Barbearia
      - key: BARBEARIA_ENDERECO
        value: Rua das Colmeias, 120 - Vila Mel, São Paulo - SP
      - key: BARBEARIA_TELEFONE
        value: (11) 95235-3041
      - key: BARBEARIA_WHATSAPP
        value: "5511952353041"
      - key: BARBEARIA_INSTAGRAM
        value: ""
      - key: BARBEARIA_FICTICIA
        value: "1"
