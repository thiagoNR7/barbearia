{% extends "admin/base.html" %}
{% block titulo %}Entrar · Painel{% endblock %}

{% block admin %}
<form class="card form login" method="post">
  <h1 style="font-size:1.6rem">Área do barbeiro</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="campo">
    <label for="usuario">Usuário</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
  </div>
  <div class="campo">
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>
  </div>
  <button class="btn btn--bloco" type="submit">Entrar</button>
  <p class="texto-pequeno centro"><a href="{{ url_for('main.index') }}">← voltar ao site</a></p>
</form>
{% endblock %}
